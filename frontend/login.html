<!DOCTYPE html>
<html>
<head>

</head>
<body class="bg-[#111] flex justify-center items-center min-h-screen">

<label class="text-sm">Email</label>

<input id="pass" type="password" value="admin123" class="w-full p-3 border rounded-lg mb-3">

<script>
function checkLogin(){
  let p = document.getElementById('pass').value;
  if(p === "admin123"){
    window.location.href = "admin.html";
  } else {
    alert("Password galat hai bawa! admin123 daal");
  }
}
</script>
</body>
