<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#111] flex justify-center items-center min-h-screen p-4">
<div class="bg-white p-8 rounded-[24px] w-full max-w-[420px] shadow-2xl">
<div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-bold mx-auto mb-3">P</div>
<h1 class="text-2xl font-bold text-center">ProDesk Login</h1>
<p class="text-gray-500 text-sm text-center mb-6">Mini ITSM for Factory</p>

<label class="text-sm text-gray-600">Email</label>
<input value="admin@prodesk.com" class="w-full p-3 border rounded-lg mb-3 bg-gray-50">

<label class="text-sm text-gray-600">Password</label>
<input type="password" value="123456" class="w-full p-3 border rounded-lg mb-3 bg-gray-50">

<label class="text-sm text-gray-600">ROLE</label>
<select class="w-full p-3 border rounded-lg mb-4 bg-gray-100">
<option>Admin</option><option>Technician</option><option>User</option>
</select>

<div class="flex justify-between items-center mb-4 text-sm">
<label><input type="checkbox" checked> Remember me</label>
<a href="#" class="font-semibold underline">Forgot Password?</a>
</div>

<button onclick="location.href='dashboard.html'" class="bg-black text-white w-full p-3 rounded-lg font-semibold">Login</button>

<p class="text-center text-sm mt-4 text-gray-500">Don't have account? <a class="text-black font-bold underline">Contact IT Admin</a></p>

<div class="grid grid-cols-3 gap-3 mt-6">
<div class="bg-gray-100 p-3 rounded-xl text-center"><p class="text-xs text-gray-500">Total:</p><p class="font-bold text-xl">12</p></div>
<div class="bg-gray-100 p-3 rounded-xl text-center"><p class="text-xs text-gray-500">Open:</p><p class="font-bold text-xl">3</p></div>
<div class="bg-gray-100 p-3 rounded-xl text-center"><p class="text-xs text-gray-500">Closed:</p><p class="font-bold text-xl">9</p></div>
</div>
</div></body></html>
