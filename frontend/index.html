<!DOCTYPE html>
<html>
<head>
<title>ProDesk - Mini ITSM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-[400px] rounded-[24px] p-8 shadow-2xl">
  <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white font-bold text-xl mb-4">P</div>
  <h1 class="text-3xl font-bold">ProDesk</h1>
  <p class="text-gray-500 mb-6">Mini ITSM for Factory IT</p>

  <input placeholder="Email: admin@prodesk.com" class="w-full p-3 border rounded-xl mb-3 bg-gray-50">
  <input placeholder="Password" type="password" class="w-full p-3 border rounded-xl mb-6 bg-gray-50">

  <button onclick="showDash()" class="w-full bg-black text-white p-3 rounded-xl font-semibold">Login & View Dashboard</button>

  <div id="dash" class="hidden mt-8 border-t pt-6">
    <h2 class="font-bold text-lg">✅ Live Tickets</h2>
    <div class="mt-3 space-y-3">
      <div class="p-3 bg-red-50 border border-red-200 rounded-xl"><b>[High] SAP Not Working</b><br><span class="text-sm">Status: Open</span></div>
      <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-xl"><b>[Medium] Printer Issue</b><br><span class="text-sm">Status: In Progress</span></div>
      <div class="p-3 bg-green-50 border border-green-200 rounded-xl"><b>[Low] Password Reset</b><br><span class="text-sm">Status: Closed</span></div>
    </div>
  </div>
</div>
<script>function showDash(){document.getElementById('dash').classList.remove('hidden');}</script>
</body>
</html>
