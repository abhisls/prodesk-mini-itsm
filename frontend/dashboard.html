<!DOCTYPE html><html><head><title>Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>body{font-family:sans-serif;background:#f1f5f9;margin:0}.nav{background:#0f172a;color:white;padding:15px} .stats{display:flex;gap:20px;padding:20px} .stat{background:white;padding:20px;border-radius:10px;flex:1;box-shadow:0 2px 10px #0001} canvas{background:white;border-radius:10px;padding:20px}</style>
    </head><body>
    <div class="nav">ProDesk - Admin Dashboard</div>
    <div class="stats"><div class="stat" id="open">Open: 0</div><div class="stat" id="progress">In Progress: 0</div><div class="stat" id="closed">Closed: 0</div></div>
    <div style="display:flex;gap:20px;padding:20px"><div style="flex:1"><canvas id="taskChart"></canvas></div><div style="flex:1;background:white;padding:20px;border-radius:10px"><h3>Create Task</h3><input id="title" placeholder="Title"><br><br><input id="desc" placeholder="Description"><br><br><input id="assign" placeholder="Assign to User ID (2)"><br><br><button onclick="createTask()">Create</button></div></div>
    <script>
    let chart;
    function load(){fetch('../backend/get_tasks.php').then(r=>r.json()).then(data=>{
     let o=data.filter(t=>t.status=='Open').length, p=data.filter(t=>t.status=='In Progress').length, c=data.filter(t=>t.status=='Closed').length;
      open.innerText='Open: '+o; progress.innerText='In Progress: '+p; closed.innerText='Closed: '+c;
       if(chart) chart.destroy();
        chart=new Chart(document.getElementById('taskChart'),{type:'doughnut',data:{labels:['Open','In Progress','Closed'],datasets:[{data:[o,p,c],backgroundColor:['#f97316','#22c55e','#0f172a']}]}})
        })}
        function createTask(){fetch('../backend/create_task.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`title=${title.value}&desc=${desc.value}&assign_to=${assign.value}`}).then(()=>load())}
        load();
        </script></body></html>
